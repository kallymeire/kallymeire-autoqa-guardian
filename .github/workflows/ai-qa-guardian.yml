name: AutoQA Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar diff do PR
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Analisar PR com IA e gerar testes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze_pr.py --diff pr.diff --out tests/test_generated.py --summary risk_summary.md

      - name: Rodar testes gerados (quality gate)
        run: pytest tests/ -v

      - name: Comentar resumo de riscos no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('risk_summary.md')
              ? fs.readFileSync('risk_summary.md', 'utf8')
              : 'Sem resumo gerado nesta execução.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🛡️ AutoQA Guardian\n\n${summary}`
            });

      - name: Notificar n8n
        if: always()
        run: |
          curl -s -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"pr\": ${{ github.event.pull_request.number }}, \"status\": \"${{ job.status }}\", \"repo\": \"${{ github.repository }}\"}" || true
